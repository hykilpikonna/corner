services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corner}
      POSTGRES_DB: ${POSTGRES_DB:-corner}
    volumes:
      - ./pgdata:/var/lib/postgresql/data:Z
    networks:
      - tunnel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corner} -d ${POSTGRES_DB:-corner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://corner:corner@postgres:5432/corner}
      DATA_DIR: ${DATA_DIR:-/data}
    volumes:
      - ./data:/data:Z
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - tunnel
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel run
    env_file:
      - .env
    volumes:
      - ./config.yml:/etc/cloudflared/config.yml:Z
      - ./credentials.json:/etc/cloudflared/credentials.json:Z
    networks:
      - tunnel
    depends_on:
      api:
        condition: service_healthy

networks:
  tunnel:
