name: Nuxt Static Deploy

on:
#   release:
#     types: [published, created, edited, released, prereleased]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build and deploy main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install and generate
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: End-to-end tests
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || secrets.CLOUDFLARE_PROJECT_NAME || 'corner' }}
